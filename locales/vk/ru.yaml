page:
  start: |
    Привет! Это бот для расписания ЯГТУ
    ${ctx.state.userSocial.groupName ? '' : '\nНапиши «Помощь» / «help», чтобы увидеть примеры сообщений для бота'} \
    ${ctx.isDM ? '\nДля смены группы или преподавателя используй кнопки ниже.' : ''} \
    ${webViewLink ? ('\nПросмотр расписания в браузере — ' + webViewLink + (ctx.state.userSocial.groupName ? '/g/' + encodeGroupNameForUrl(ctx.state.userSocial.groupName) : '')) : ''}

  init_bot: |
    Чтобы посмотреть расписание, можно авторизироваться, выбрать учебную группу или преподавателя.
    Авторизация для просмотра расписания не обязательна.\
    ${useInline ? '' : ' Для этого напиши — войти, группа или преподаватель'}

  welcome_features: |
    Всё для учёбы — в одном месте

    📅 Расписание на сегодня, завтра или неделю
    🎓 Выбор учебной группы или преподавателя
    🔔 Рассылка расписания по выбранным дням и времени

    Добавь бота в беседу, чтобы пользоваться им вместе с группой.

  help: |
    🤖 Помощь по боту

    В VK нет меню команд: просто отправляй боту сообщения из примеров ниже.

    📅 Расписание
    • Расписание — на ближайший учебный день
    • Расписание на завтра — на завтра
    • Расписание на неделю — на текущую неделю
    • Расписание ЦИС-46 — для другой группы, не меняя вашу
    • Расписание подробно — расширенный вариант

    👨‍🏫 Можно написать фамилию преподавателя, чтобы выбрать его из списка и посмотреть расписание. Например: <code>преподаватель Иванов</code> или просто <code>Иванов</code>

    🎓 Настройки
    • Группа [название группы] — выбрать учебную группу
    • Группы — выбрать учебную группу из списка
    • Преподаватель — выбрать преподавателя
    • Командой /notif или кнопками в сообщениях можно настроить ежедневную рассылку расписания

    💬 Обратная связь
    • /feedback — оставить отзыв или предложить улучшение
    • /invite — пригласить бота в беседу

    🧭 Если запутались
    • /start — открыть главное меню
    • Помощь или /help — открыть эту справку
    • Во время настройки или "зависания" используй кнопку или команду «Отмена».

  unknown_message: |
    Не понял сообщение. Напиши «расписание», /help / «Помощь» или воспользуйся кнопками ниже.

  auth:
    need_auth: |
      🐜 Вы не авторизованы.
      Необходимо пройти авторизацию через ЯГТУ ID
    done: |
      Привет, ${user.fullname}!
      ${user.groupName ? 'Ваша группа ' + user.groupName + '\n' : ''}
      🔑 Авторизация пройдена
    cancel: |
      🙅‍♂️ Авторизация через Social connect была отменена
    fail: |
      🧚‍♀️ Возникла ошибка при проверке авторизации.

  social_connect:
    other: Что-то пошло не так
    need_connect: |
      🔑 Необходимо пройти единую авторизацию в боте @${botName}

      Для этого нажмите кнопку
    wait_confirm: 🦉 Вам отправлено подтверждение на авторизацию в @${botName}
    already_sent: 🐨 Вам уже было отправлено подтверждение на авторизацию. Проверьте его в @${botName}

  profile:
    info: |
      🗝 Ваш логин: ${user.login}
      Полное имя: ${user.fullname}
      Группа: ${user.groupName || '-'}

      ${user.isRewoked ? '\n🔐 Данные устарели. Пройдите авторизацию повторно - /auth' : ''}

  schedule:
    nearest_schedule: |
      ⚠️ Ближайшее расписание через ${pluralize(days, 'день', 'дня', 'дней')}:
      ${content}
    not_found_today: На этот день расписания нет.
    teachers_list: |
      Преподаватели
      Страница: ${currentPage}/${totalPages}

      ${query ? 'Поиск: ' + query : 'Выбери преподавателя или напиши преподаватель Фамилия'}
    teacher_selected: |
      Выбран преподаватель: ${teacher.name}

      Расписание: /tday или расписание преподавателя.
      На неделю: /tweek или расписание преподавателя на неделю.
    teacher_not_found: |
      Преподаватель по запросу ${query} не найден.
    teacher_search_hint: |
      Использование: /teacher Фамилия или преподаватель Фамилия
      Например: преподаватель Иванов
    teacher_list_expired: Список преподавателей устарел. Открой новый через /tlist.
    teacher_keyboard_updated: Клавиатура расписания обновлена.
    teacher_not_selected: |
      Сначала выбери преподавателя через преподаватель Фамилия или /tlist.
    week_title: |
      Расписание на ${isNextWeek ? 'следующую' : 'текущую'} неделю:
    teacher_week_title: |
      Расписание преподавателя на ${isNextWeek ? 'следующую' : 'текущую'} неделю:
  schedule_notification:
    settings: |
      Рассылка расписания
      ${notif ? ('Группа: ' + notif.targetId + '\nВремя: ' + String(notif.deliveryHour).padStart(2, '0') + ':' + String(notif.deliveryMinute).padStart(2, '0') + '\nРасписание: ' + (notif.targetDayOffset ? 'на завтра' : 'на сегодня') + '\nДни: ' + notif.weekdaysLabel + '\nСтатус: ' + (notif.isEnabled ? 'включена' : 'выключена')) : 'Рассылка пока не настроена.'}
    select_hour: Выбери время отправки.
    select_minute: Выбери минуты отправки.
    select_target_day: Выбери, расписание на какой день получать в это время.
    select_weekdays: Выбери дни недели. По умолчанию включены все дни.
    need_group: Сначала выбери учебную группу, затем настрой рассылку.
    saved: Настройки рассылки сохранены.
    select_group: Выбери группу для этой рассылки.
    confirm_delete: Удалить рассылку расписания для группы ${groupName}? Это действие нельзя отменить.
  feedback:
    select_category: |
      Обратная связь
      Выбери категорию.
    enter_content: Отправь текст. Можно вложить до 10 медиа. Когда закончишь, нажми «Отправить».
    first_message: Это сообщение будет основным. Можно уже отправить отзыв или добавить ещё сообщения.
    message_limit_reached: В отзыв вошли 10 сообщений — это лимит. Теперь его можно отправить.
    media_limit: Можно приложить не более 10 медиа.
    content_required: Добавь текст или медиа, прежде чем отправлять отзыв.
    cooldown: Новый отзыв можно отправить через 5 минут.
    submitted: Спасибо! Отзыв №${feedbackId} отправлен.
    delivery_pending: Спасибо! Отзыв №${feedbackId} сохранён; администраторам он будет передан позже.

  select_group:
    current: 'Сейчас указана группа: ${groupName}'
    enter_name_with_example: |
      Напиши название нужной группы.\nНапример, ${randomGroupName} \
      или ${randomGroupName2.toLowerCase()}
    institutes_list: |
      Список институтов
      Страница: ${currentPage}/${totalPages}
    groups_list: |
      Список групп${instituteName ? ': ' + instituteName : ''}
      Страница: ${currentPage}/${totalPages}
    selected: |
      Выбрана группа: ${selectedGroupName}
    not_found: |
      Ошибка: Группа "${groupName}" не найдена
      Напиши другое название, Отмена или /cancel.
    reset: Группа сброшена

  broadcast:
    private_only: VK broadcast scene доступен только в личных сообщениях
    settings: |
      Настройки рассылки
      Получателей сейчас: ${recipientsCount}
      Режим аудитории: ${audienceMode === 'manual' ? 'тестовая выборка' : 'все по фильтру'}
      Тестовая выборка: ${selectedCount ? selectedCount + ' ID: ' + selectedRecipientIds.join(', ') : '-'}
      Авторизованные: ${filter.onlyAuthorized === undefined ? 'любые' : filter.onlyAuthorized ? 'да' : 'нет'}
      Группы: ${filter.groupNames?.length ? filter.groupNames.length + ' выбрано' : '-'}
      Fallback-кнопка: ${feedbackButton?.text || '-'}
      ${feedbackButton ? ('Ответ после клика: ' + (feedbackButton.responseText || 'стандартный: «Спасибо за feedback!»') + '\nКнопка после клика: ' + feedbackAfterClickSummary) : ''}
      Доп. кнопки:
      ${actionKeyboardSummary}

      Нажми «Далее» или отправь /next для выбора сообщения.
    select_recipients: |
      Тестовая выборочная рассылка
      Выбрано: ${selectedCount}
      Страница: ${currentPage}/${totalPages}

      Нажми на пользователя, чтобы переключить выбор.
    send_sample: Отправь текст, стикер или сообщение с вложением для рассылки.
    ready: |
      Рассылка готова к запуску.
      Получателей: ${recipientsCount}
      Тестовая выборка: ${selectedCount}

      Нажми кнопку для создания очереди. Очередь будет создана на паузе.
    queued: |
      Рассылка №${campaignId} поставлена в очередь. Получателей: ${recipientsCount}
    canceled: Рассылка отменена
    already_active: |
      Уже есть активная рассылка${campaign ? ' №' + campaign.id : ''}.
      Ее надо запустить, остановить или удалить перед созданием новой.
    no_recipients: Для тестовой рассылки выбери хотя бы одного получателя.
    message_not_found: Не удалось определить сообщение для рассылки. Отправь текст, стикер или вложение.
    send_command_hint: Для запуска нажми «Создать очередь».
    settings_ready_hint: Настройки готовы. Нажми «Далее» или отправь /next.
    filter_group: |
      Отправь название учебной группы для фильтра рассылки.
      Сейчас: ${groupName || 'все группы'}
    filters: |
      Фильтры аудитории
      Получателей: ${recipientsCount}
      Авторизованные: ${filter.onlyAuthorized === undefined ? 'любые' : filter.onlyAuthorized ? 'да' : 'нет'}
      Группы: ${groupsCount ? groupsCount + ' выбрано' : 'все'}
      ${groupsText || ''}
      Активность: ${activityText || 'не ограничена'}
      Исключить кампании: ${excludeCampaignIds.length ? excludeCampaignIds.join(', ') : 'нет'}
    filter_institutes: |
      Институты с подходящими получателями
      Страница: ${currentPage}/${totalPages}
    filter_groups_menu: Выбор групп
    filter_groups: |
      Группы${instituteName ? ': ' + instituteName : ''}
      Выбрано: ${selectedGroupsCount}
      Страница: ${currentPage}/${totalPages}
    filter_groups_text: |
      Отправь список групп через запятую, точку с запятой или новую строку.
      Список заменит текущий фильтр групп.
    filter_groups_list: |
      Выбранные группы
      ${groupNames}
    filter_activity_mode: Выбери правило активности.
    filter_activity_text: |
      Отправь дату или диапазон в формате ДД.ММ.ГГГГ или ДД.ММ.ГГГГ - ДД.ММ.ГГГГ.
      Для режима «до даты» будут выбраны пользователи, активные до конца указанного дня. Для диапазона обе даты включаются.
    action_settings: |
      Дополнительные кнопки
      Включай нужные действия и при необходимости меняй их текст. Кнопки добавляются к каждому сообщению рассылки.
      Сейчас:
      ${actionKeyboardSummary}
    unsubscribe_confirm: |
      🔕 Отключить уведомления?

      Бот больше не будет сам отправлять тебе рассылки и личные уведомления с расписанием.
      Сообщения в беседах останутся.
    action_text_select: Выбери кнопку, текст которой нужно изменить.
    action_text: Отправь текст для дополнительной кнопки. Максимум 40 символов.
    action_text_invalid: Текст кнопки должен содержать от 1 до 40 символов.
    action_link_url: Отправь ссылку для кнопки. Разрешены только адреса http:// или https://.
    action_link_url_invalid: Укажи корректную ссылку, начинающуюся с http:// или https://.
    filter_exclude_campaigns_text: |
      Выбери рассылки галочками в списке. Пользователи, для которых уже
      создавалась delivery выбранных кампаний, будут исключены.
    filter_exclude_campaigns: |
      Исключить получателей прошлых рассылок
      Выбрано ID: ${selectedCampaignIds.length ? selectedCampaignIds.join(', ') : '-'}
      Страница: ${currentPage}/${totalPages}

      Нажми на рассылку, чтобы включить или выключить её из исключения.
    feedback_text: |
      Отправь текст для кнопки feedback. Максимум 40 символов.
      По умолчанию используется 🫡.
    feedback_text_invalid: Текст кнопки должен содержать от 1 до 40 символов.
    source_required: Сначала отправь сообщение-образец.
    new_sample: Отправь новое сообщение-образец.
    queue_status: |
      Broadcast queue
      Active: ${status.active}
      Waiting: ${status.waiting}
      Delayed: ${status.delayed}
      Completed: ${status.completed}
      Failed: ${status.failed}
      Paused: ${status.paused}
    menu: |
      Панель рассылок

      Создание, просмотр статуса и управление последними рассылками доступны через кнопки ниже.
    campaigns_list: |
      Последние рассылки
      ${items.length ? items.map((item) => '№' + item.id + ' • ' + item.status + ' • ' + item.sentCount + '/' + item.totalCount + ' • ' + item.createdAt.toLocaleString('ru-RU')).join('\n') : 'Рассылок пока нет'}

      Для деталей выбери рассылку кнопкой ниже.
    campaign_details: |
      Рассылка №${campaign.id}
      Статус: ${campaign.status}
      Режим: ${campaign.mode}
      Содержимое: ${campaign.contentPreview || '-'}
      Версия настроек: ${campaign.settingsVersion || 1}
      Авторизованные: ${campaign.audienceFilter.onlyAuthorized === undefined ? 'любые' : campaign.audienceFilter.onlyAuthorized ? 'да' : 'нет'}
      Группы: ${campaign.audienceFilter.groupNames?.length ? campaign.audienceFilter.groupNames.join(', ') : campaign.audienceFilter.groupName || 'все'}
      Активность: ${campaign.audienceFilter.lastInteractionAfter || campaign.audienceFilter.lastInteractionBefore ? (campaign.audienceFilter.lastInteractionAfter || '−∞') + ' — ' + (campaign.audienceFilter.lastInteractionBefore || '+∞') : 'не ограничена'}
      Исключить рассылки: ${campaign.audienceFilter.excludeCampaignIds?.length ? campaign.audienceFilter.excludeCampaignIds.join(', ') : 'нет'}
      Feedback: ${campaign.feedbackButton?.text || 'нет'}
      Доп. кнопки: ${campaign.actionKeyboard?.length ? campaign.actionKeyboard.map((item) => item.type).join(', ') : 'нет'}
      Получателей: ${campaign.totalCount}
      Успешно: ${campaign.sentCount}
      Ошибки: ${campaign.failedCount}
      Пропущено: ${campaign.skippedCount}
      Создана: ${campaign.createdAt.toLocaleString('ru-RU')}
    campaign_deleted: |
      Сообщения рассылки №${campaignId} удалены, история сохранена.
      Удалено сообщений: ${deletedCount}
      Не удалось удалить: ${failedCount}
      Осталось: ${remainingCount}
    campaign_delete_confirm: |
      Удалить сообщения рассылки №${campaignId}?

      Можно удалить все сообщения сразу или выбрать конкретных получателей.
    campaign_delete_selector: |
      Выбери сообщения рассылки №${campaignId} для удаления.
      Выбрано: ${selectedCount}
      Страница: ${currentPage}/${totalPages}
    campaign_delete_empty: В этой рассылке нет сообщений, доступных для удаления.
    campaign_delete_no_selection: Сначала выбери хотя бы одно сообщение.
    campaign_delete_usage: |
      Использование: /broadcast_delete ID
    feedback_response_text: Введи ответ после клика (до 200 символов).
    feedback_response_text_invalid: Ответ должен быть от 1 до 200 символов.
    feedback_after_text: Введи текст кнопки, которая появится после первого клика (до 40 символов).
    feedback_required: Сначала включи feedback-кнопку.
    feedback_settings: |
      Fallback-кнопка
      Исходная кнопка: ${feedbackButton.text}
      Ответ после первого клика: ${feedbackButton.responseText || 'стандартный: «Спасибо за feedback!»'}
      После первого клика: ${feedbackAfterClickSummary}
    filter_groups_empty: Сначала выбери хотя бы одну группу.
    done: Готово. Основное меню бота снова доступно.
    campaign_not_found: |
      Рассылка №${campaignId} не найдена.
    progress: |
      Рассылка №${campaignId}
      Готово: ${doneCount}/${totalCount}
      Успешно: ${sentCount}
      Ошибки: ${failedCount}
      Пропущено: ${skippedCount}
      Статус: ${status}

