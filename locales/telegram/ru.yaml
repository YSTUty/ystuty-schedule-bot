regexp:
  start: //?(start|старт|начать)( .*)?/i
  help: //?(help|помощь)/i
  schedule:
    select_group: /^(?<trigger>(group|группа) ?)?${patternGroupName0}?$/i
    for_one_day: /^(расписание|.тт)((?<tomorrow> на завтра)|( через (?<skipDays>[0-9]{1,3})))?( ${patternGroupName})?$/i
    for_week: /^(((расписание|.тт) на(?<next> (след(ующую)?))? неделю)|\.рбн)( ${patternGroupName})?$/i

error:
  select_group:
    only_admin_or_owner: |
      <b>Ошибка:</b> Только админ или пригласивший может выбрать группу
  bot:
    conversation_not_admin: |
      <b>Ошибка:</b> Бот не имеет прав администратора в этой беседе

page:
  start: |
    Привет! Это бот для расписания ЯГТУ
    ${ctx.userSocial.groupName ? '' : '\nНапиши <code>help</code> для получения списка команд'} \
    ${ctx.chat?.type === 'private' ? '\nДля смены группы или преподавателя используй кнопки ниже.' : ''} \
    ${webViewLink ? ('\nПросмотр расписания в браузере — <a href="https://' + webViewLink + (ctx.userSocial.groupName ? ('/g/' + ctx.userSocial.groupName) : '') + '">View</a>') : ''}

  init_bot: |
    Чтобы посмотреть расписание, можно <b>авторизироваться</b>, <i>выбрать учебную группу</i> или преподавателя.
    Авторизация для просмотра расписания не обязательна.

  help: |
    Команды для обращения к боту:
    <code>расписание</code> или сокращенно <code>.тт</code>
    • <code>.тт</code> - Получить расписание на текущий/следующий день
    • <code>.тт через 4</code> - Получить расписание, которое будет через 4 дня
    • <code>.тт на завтра</code> - Расписаине на завтрашний день
    • <code>.тт на неделю</code> - Расписаине на всю текущую неделю (или сокращенно .рбн)

    Если расписания на следующий день нету, то поиск продолжается глубиной в неделю

    • <code>группа</code> - выбор учебной группы для расписания (для бесед задается администратором)

  auth:
    need_auth: |
      🐜 Вы не авторизированы.
      Необходимо пройти авторизацию через ЯГТУ ID
    done: |
      Привет, <i>${user.fullname}</i>!
      ${user.groupName ? 'Ваша группа <code>' + user.groupName + '</code>\n' : ''}
      🔑 Авторизация пройдена
    cancel: |
      🙅‍♂️ Авторизация через Social connect была отменена
    fail: |
      🧚‍♀️ Возникла ошибка при проверке авторизации.

  social_connect:
    other: Что-то пошло не так
    need_connect: |
      🔑 Необходимо пройти единую авторизацию в боте <code>@${botName}</code>.

      Для этого нажмите конпку.
    wait_confirm: 🦉 Вам отправлено подтверждение на авторизацию в @${botName}
    already_sent: 🐨 Вам уже было отправлено подтверждение на авторизацию. Проверьте его в @${botName}

  profile:
    info: |
      🗝 Ваш логин: <i>${user.login}</i>
      Полное имя: <i>${user.fullname}</i>
      Группа: <code>${user.groupName || '-'}</code>

      ${user.isRewoked ? '\n<b>🔐 Данные устарели.</b> Пройдите авторизацию повторно - /auth' : ''}

  schedule:
    nearest_schedule: |
      ⚠️ Ближайшее расписание через ${pluralize(days, 'день', 'дня', 'дней')}:
      ${content}
    not_found_today: Похоже, что на этот день нету расписания... 🐜
    teachers_list: |
      <b>Преподаватели</b>
      <code>---☼ (${currentPage}/${totalPages}) ☼---</code>

      ${query ? 'Поиск: <code>' + query + '</code>' : 'Выбери преподавателя или напиши <code>преподаватель Фамилия</code>'}
    teacher_selected: |
      Выбран преподаватель: <b>${teacher.name}</b>

      Расписание: <code>/tday</code> или <code>расписание преподавателя</code>.
      На неделю: <code>/tweek</code> или <code>расписание преподавателя на неделю</code>.
    teacher_not_found: |
      Преподаватель по запросу <code>${query}</code> не найден.
    teacher_search_hint: |
      Использование: <code>/teacher Фамилия</code> или <code>преподаватель Фамилия</code>
      Например: <code>преподаватель Иванов</code>
    teacher_list_expired: Список преподавателей устарел. Открой новый через /tlist.
    teacher_keyboard_updated: Клавиатура расписания обновлена.
    teacher_not_selected: |
      Сначала выбери преподавателя через <code>преподаватель Фамилия</code> или <code>/tlist</code>.
    week_title: |
      Расписание на ${isNextWeek ? 'следующую' : 'текущую'} неделю:
    teacher_week_title: |
      Расписание преподавателя на ${isNextWeek ? 'следующую' : 'текущую'} неделю:
  schedule_notification:
    settings: |
      <b>Рассылка расписания</b>
      ${notif ? ('Группа: <code>' + notif.targetId + '</code>\nВремя: <code>' + String(notif.deliveryHour).padStart(2, '0') + ':' + String(notif.deliveryMinute).padStart(2, '0') + '</code>\nРасписание: <code>' + (notif.targetDayOffset ? 'на завтра' : 'на сегодня') + '</code>\nДни: <code>' + notif.weekdaysLabel + '</code>\nСтатус: <code>' + (notif.isEnabled ? 'включена' : 'выключена') + '</code>') : 'Рассылка пока не настроена.'}
    select_hour: Выбери время отправки.
    select_minute: Выбери минуты отправки.
    select_target_day: Выбери, расписание на какой день получать в это время.
    select_weekdays: Выбери дни недели. По умолчанию включены все дни.
    need_group: Сначала выбери учебную группу, затем настрой рассылку.
    saved: Настройки рассылки сохранены.
    select_group: Выбери группу для этой рассылки.
    confirm_delete: Удалить рассылку расписания для группы <code>${groupName}</code>? Это действие нельзя отменить.

  select_group:
    current: 'Сейчас указана группа: <code>${groupName}</code>'
    enter_name_with_example: |
      Напиши название нужной группы.\nНапример, <code>${randomGroupName}</code> \
      или <code>${randomGroupName2.toLowerCase()}</code>
    institutes_list: |
      Список институтов
      Страница: ${currentPage}/${totalPages}
    groups_list: |
      Список групп${instituteName ? ': ' + instituteName : ''}
      Страница: ${currentPage}/${totalPages}
    selected: |
      Выбрана группа: <code>${selectedGroupName}</code>
    not_found: |
      <b>Ошибка:</b> Группа <code>${groupName}</code> не найдена
      Напиши другое название, <code>Отмена</code> или <code>/cancel</code>.
    reset: Группа сброшена

  broadcast:
    private_only: Broadcast wizard доступен только в личном чате
    settings: |
      <b>Настройки рассылки</b>
      Получателей сейчас: <code>${recipientsCount}</code>
      Режим аудитории: <code>${audienceMode === 'manual' ? 'тестовая выборка' : 'все по фильтру'}</code>
      Тестовая выборка: <code>${selectedCount ? selectedCount + ' ID: ' + selectedRecipientIds.join(', ') : '-'}</code>

      Фильтры первой версии:
      • social = telegram
      • hasDM = ${filter.hasDM}
      • isBlockedBot = ${filter.isBlockedBot}
      • onlyAuthorized = ${filter.onlyAuthorized === undefined ? 'любые' : filter.onlyAuthorized ? 'да' : 'нет'}
      • groups = ${filter.groupNames?.length ? filter.groupNames.length + ' выбрано' : '-'}
      • mode = ${mode}
      • fallback-кнопка = <code>${feedbackButton?.text || '-'}</code>
      ${feedbackButton ? ('• ответ после клика = <code>' + (feedbackButton.responseText || 'стандартный: «Спасибо за feedback!»') + '</code>\n• кнопка после клика = <code>' + (feedbackButton.afterClickText || 'удаляется') + '</code>') : ''}
      • доп. кнопки = <code>${actionKeyboard?.length ? actionKeyboard.map((item) => item.type).join(', ') : '-'}</code>

      Нажми «Далее» или отправь <code>/next</code> для выбора сообщения.
    select_recipients: |
      <b>Тестовая выборочная рассылка</b>
      Выбрано: <code>${selectedCount}</code>
      Страница: <code>${currentPage}/${totalPages}</code>

      Нажми на пользователя, чтобы переключить выбор.
    send_sample: Отправь сообщение-образец для рассылки. Оно будет разослано в выбранном режиме.
    ready: |
      <b>Рассылка готова к запуску</b>
      Получателей: <code>${recipientsCount}</code>
      Выбрано вручную: <code>${selectedCount}</code>
      Режим: <code>${mode}</code>

      Используй inline-кнопки ниже: создать очередь или вернуться к настройкам.
    queued: |
      Рассылка №${campaignId} поставлена в очередь. Получателей: <code>${recipientsCount}</code>
    canceled: Рассылка отменена
    already_active: |
      Уже есть активная рассылка${campaign ? ' №' + campaign.id : ''}.
      Ее надо запустить, остановить или удалить перед созданием новой.
    no_recipients: Для тестовой рассылки выбери хотя бы одного получателя.
    message_not_found: Не удалось определить сообщение для рассылки. Отправь текст, стикер или вложение.
    send_command_hint: Для запуска рассылки нажми «Создать очередь».
    settings_ready_hint: Настройки готовы. Нажми «Далее» или отправь /next.
    filter_group: |
      Отправь название учебной группы для фильтра рассылки.
      Сейчас: <code>${groupName || 'все группы'}</code>
    filters: |
      <b>Фильтры аудитории</b>
      Получателей: <code>${recipientsCount}</code>
      Авторизованные: <code>${filter.onlyAuthorized === undefined ? 'любые' : filter.onlyAuthorized ? 'да' : 'нет'}</code>
      Группы: <code>${groupsCount ? groupsCount + ' выбрано' : 'все'}</code>
      Активность: <code>${activityText || 'не ограничена'}</code>
      Исключить кампании: <code>${excludeCampaignIds.length ? excludeCampaignIds.join(', ') : 'нет'}</code>
    filter_institutes: |
      <b>Институты с подходящими получателями</b>
      Страница: <code>${currentPage}/${totalPages}</code>
    filter_groups_menu: <b>Выбор групп</b>
    filter_groups: |
      <b>Группы${instituteName ? ': ' + instituteName : ''}</b>
      Выбрано: <code>${selectedGroupsCount}</code>
      Страница: <code>${currentPage}/${totalPages}</code>
    filter_groups_text: |
      Отправь список групп через запятую, точку с запятой или новую строку.
      Список заменит текущий фильтр групп.
    filter_groups_list: |
      <b>Выбранные группы</b>
      <code>${groupNames}</code>
    filter_activity_mode: Выбери правило активности.
    filter_activity_text: |
      Отправь дату или диапазон в формате <code>ДД.ММ.ГГГГ</code> или <code>ДД.ММ.ГГГГ - ДД.ММ.ГГГГ</code>.
      Для режима «до даты» будут выбраны пользователи, активные до конца указанного дня. Для диапазона обе даты включаются.
    action_settings: |
      <b>Дополнительные кнопки</b>
      Включай нужные действия и при необходимости меняй их текст. Кнопки добавляются к каждому сообщению рассылки.
    action_text: Отправь текст для дополнительной кнопки. Максимум 40 символов.
    action_text_invalid: Текст кнопки должен содержать от 1 до 40 символов.
    filter_exclude_campaigns_text: |
      Выбери рассылки галочками в списке. Пользователи, для которых уже
      создавалась delivery выбранных кампаний, будут исключены.
    filter_exclude_campaigns: |
      <b>Исключить получателей прошлых рассылок</b>
      Выбрано ID: <code>${selectedCampaignIds.length ? selectedCampaignIds.join(', ') : '-'}</code>
      Страница: <code>${currentPage}/${totalPages}</code>

      Нажми на рассылку, чтобы включить или выключить её из исключения.
    feedback_text: |
      Отправь текст для кнопки feedback. Максимум 40 символов.
      По умолчанию используется 🫡.
    feedback_text_invalid: Текст кнопки должен содержать от 1 до 40 символов.
    source_required: Сначала отправь сообщение-образец.
    new_sample: Отправь новое сообщение-образец.
    queue_status: |
      <b>Broadcast queue</b>
      Active: <code>${status.active}</code>
      Waiting: <code>${status.waiting}</code>
      Delayed: <code>${status.delayed}</code>
      Completed: <code>${status.completed}</code>
      Failed: <code>${status.failed}</code>
      Paused: <code>${status.paused}</code>
    menu: |
      <b>Панель рассылок</b>

      Создание, просмотр статуса и управление последними рассылками доступны через кнопки ниже.
    campaigns_list: |
      <b>Последние рассылки</b>

      ${items.length ? items.map((item) => '№' + item.id + ' • ' + item.status + ' • ' + item.sentCount + '/' + item.totalCount + ' • ' + item.createdAt.toLocaleString('ru-RU')).join('\n') : 'Рассылок пока нет'}

      Для деталей выбери рассылку кнопкой ниже.
    campaign_details: |
      <b>Рассылка №${campaign.id}</b>
      Статус: <code>${campaign.status}</code>
      Режим: <code>${campaign.mode}</code>
      Содержимое: <code>${campaign.contentPreview || '-'}</code>
      Версия настроек: <code>${campaign.settingsVersion || 1}</code>
      Авторизованные: <code>${campaign.audienceFilter.onlyAuthorized === undefined ? 'любые' : campaign.audienceFilter.onlyAuthorized ? 'да' : 'нет'}</code>
      Группы: <code>${campaign.audienceFilter.groupNames?.length ? campaign.audienceFilter.groupNames.join(', ') : campaign.audienceFilter.groupName || 'все'}</code>
      Активность: <code>${campaign.audienceFilter.lastInteractionAfter || campaign.audienceFilter.lastInteractionBefore ? (campaign.audienceFilter.lastInteractionAfter || '−∞') + ' — ' + (campaign.audienceFilter.lastInteractionBefore || '+∞') : 'не ограничена'}</code>
      Исключить рассылки: <code>${campaign.audienceFilter.excludeCampaignIds?.length ? campaign.audienceFilter.excludeCampaignIds.join(', ') : 'нет'}</code>
      Feedback: <code>${campaign.feedbackButton?.text || 'нет'}</code>
      Доп. кнопки: <code>${campaign.actionKeyboard?.length ? campaign.actionKeyboard.map((item) => item.type).join(', ') : 'нет'}</code>
      Получателей: <code>${campaign.totalCount}</code>
      Успешно: <code>${campaign.sentCount}</code>
      Ошибки: <code>${campaign.failedCount}</code>
      Пропущено: <code>${campaign.skippedCount}</code>
      Создана: <code>${campaign.createdAt.toLocaleString('ru-RU')}</code>
    campaign_deleted: |
      Сообщения рассылки №${campaignId} удалены, история сохранена.
      Удалено сообщений: <code>${deletedCount}</code>
      Не удалось удалить: <code>${failedCount}</code>
      Осталось: <code>${remainingCount}</code>
    campaign_delete_confirm: |
      Удалить сообщения рассылки №${campaignId}?

      Можно удалить все сообщения сразу или выбрать конкретных получателей.
    campaign_delete_selector: |
      Выбери сообщения рассылки №${campaignId} для удаления.
      Выбрано: <code>${selectedCount}</code>
      Страница: <code>${currentPage}/${totalPages}</code>
    campaign_delete_empty: В этой рассылке нет сообщений, доступных для удаления.
    campaign_delete_no_selection: Сначала выбери хотя бы одно сообщение.
    campaign_delete_usage: |
      Использование: <code>/broadcast_delete ID</code>
    feedback_response_text: Введи ответ после клика (до 200 символов).
    feedback_response_text_invalid: Ответ должен быть от 1 до 200 символов.
    feedback_after_text: Введи текст кнопки, которая появится после первого клика (до 40 символов).
    feedback_required: Сначала включи feedback-кнопку.
    feedback_settings: |
